  _attachInput(tahun, bulan, minggu, kelas) {
    const tbody = this.el.querySelector('tbody');
    if (!tbody) return;
    tbody.addEventListener('input', e => {
      const inp = e.target;
      if (!inp.classList || !inp.classList.contains('input-cell')) return;
      const tr = inp.closest('tr');
      if (tr && tr.classList.contains('row-saved')) tr.classList.remove('row-saved');
      let v = String(inp.value).replace(/[^0-9]/g, '');
      if (v.length > 1) v = v.slice(-1);
      inp.value = v;
      inp.classList.remove('invalid');
      if (v !== '') {
        const isSalat = inp.classList.contains('salat');
        const max = isSalat ? 7 : 4;
        const min = isSalat ? 0 : 1;
        const n = parseInt(v, 10);
        if (n > max) inp.value = String(max);
        else if (n < min && !isSalat) inp.value = String(min);
      }
    });
    tbody.addEventListener('keydown', e => {
      const inp = e.target;
      if (!inp.classList || !inp.classList.contains('input-cell')) return;
      if (e.key === 'Backspace' && inp.value === '') { e.preventDefault(); this._focusPrev(inp); }
      else if (e.key === 'Enter') { e.preventDefault(); this._focusNext(inp); }
    });
    tbody.addEventListener('blur', e => {
      if (e.target.classList && e.target.classList.contains('input-cell') && e.target.value === '') {
        e.target.classList.add('invalid');
      }
    }, true);
    $$('.btn-save-row', this.el).forEach(btn => {
      btn.onclick = e => {
        const tr = e.currentTarget.closest('tr');
        this._save([tr], e.currentTarget, false, { tahun, bulan, minggu, kelas });
      };
    });
    $('#btnSubmitBatch').onclick = e => {
      const rows = $$('tbody tr', this.el);
      if (!rows.length) return toast('Tidak ada data.', 'error');
      if (rows.length > 5 && !confirm(`Simpan data ${rows.length} siswa?\n\nData dengan kelas & minggu yang sama akan diperbarui.`)) return;
      this._save(rows, e.currentTarget, true, { tahun, bulan, minggu, kelas });
    };
  }

  _focusNext(inp) {
    const all = $$('.input-cell', this.el);
    const i = all.indexOf(inp);
    if (i >= 0 && i < all.length - 1) {
      const n = all[i + 1];
      try { n.focus(); if (n.select) n.select(); n.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch { n.focus(); }
    } else inp.blur();
  }
  _focusPrev(inp) {
    const all = $$('.input-cell', this.el);
    const i = all.indexOf(inp);
    if (i > 0) {
      const p = all[i - 1];
      try { p.focus(); if (p.select) p.select(); p.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch { p.focus(); }
    }
  }

  async _save(rowEls, btnEl, isBatch, ctx) {
    if (this._saving) return;
    this._saving = true;
    try {
      const { tahun, bulan, minggu, kelas } = ctx;
      const master = (this.app.boot && this.app.boot.master) || [];
      const masterMap = new Map();
      for (const s of master) masterMap.set(String(s.NIS), s);
      const payload = [];
      let valid = true;
      for (const tr of rowEls) {
        const nis = tr.getAttribute('data-nis');
        const siswa = masterMap.get(String(nis));
        if (!siswa) { valid = false; continue; }
        const row = { Tahun: tahun, Bulan: bulan, Minggu_Ke: minggu, Kelas: kelas, NIS: nis, Nama_Siswa: siswa.Nama_Siswa };
        const inputs = tr.querySelectorAll('.input-cell');
        for (const inp of inputs) {
          const k = inp.dataset.key;
          if (inp.value === '') { inp.classList.add('invalid'); valid = false; continue; }
          row[k] = parseInt(inp.value, 10);
        }
        payload.push(row);
      }
      if (!valid) { this._saving = false; return toast('Masih ada kolom kosong / tidak valid.', 'error'); }
      const orig = btnEl.innerHTML;
      btnEl.disabled = true;
      btnEl.innerHTML = '<span class="spinner"></span>';
      try {
        const res = await Api.simpan(payload);
        if (res.status !== 'success') throw new Error(res.message || 'Gagal menyimpan');
        for (const tr of rowEls) tr.classList.add('row-saved');
        LogsCache.invalidateAll();
        BootCache.invalidate();
        toast(isBatch ? res.message : 'Data tersimpan.', 'success');
        if (isBatch) { setTimeout(() => { const bk = $('#btnKembali'); if (bk) bk.click(); }, 900); }
        else {
          btnEl.innerHTML = '<span class="material-symbols-outlined">check</span>';
          setTimeout(() => { btnEl.innerHTML = orig; btnEl.disabled = false; }, 900);
        }
      } catch (e) {
        if (e.message !== 'Unauthorized') toast(e.message || 'Gagal menyimpan.', 'error');
        btnEl.innerHTML = orig; btnEl.disabled = false;
      }
    } finally { this._saving = false; }
  }
}

/* ========== DASH KELAS TAB ========== */
class DashKelasTab extends BaseTab {
  constructor(el, app) {
    super(el, app);
    this._charts = [];
    this.selBulan = todayM();
    this.selMinggu = 'Semua';
    this._hasData = false;
  }
  render() {
    const profile = this.app.profile;
    if (!profile) {
      this.el.innerHTML = `<div class="empty"><span class="material-symbols-outlined">bar_chart</span><p>Pilih kelas dulu.</p><button class="btn btn-primary" style="max-width:200px" id="btnPickKelas">Pilih Kelas</button></div>`;
      $('#btnPickKelas').onclick = () => this.app.showProfileModal(true);
      return;
    }
    const tahunAjaran = getTahunAjaran(this.selBulan, todayY());
    this.el.innerHTML = `
      <h2 class="section-title"><span class="material-symbols-outlined">bar_chart</span> Dashboard — ${esc(profile.kelas)}</h2>
      <div class="card" style="padding:.85rem">
        <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:.5rem;align-items:end">
          <div class="form-group" style="margin:0">
            <label>Bulan</label>
            <select id="dkBulan" class="form-select">${BULAN.map((b, i) => `<option value="${i}"${i === this.selBulan ? ' selected' : ''}>${esc(b)}</option>`).join('')}</select>
          </div>
          <div class="form-group" style="margin:0">
            <label>Pekan</label>
            <select id="dkMinggu" class="form-select">
              <option value="Semua">Semua</option>
              ${[1,2,3,4,5].map(n => `<option value="${n}"${String(this.selMinggu) === String(n) ? ' selected' : ''}>M${n}</option>`).join('')}
            </select>
          </div>
          <button id="btnLoadDk" class="btn btn-primary" style="min-width:52px;padding:.6rem">
            <span class="material-symbols-outlined">search</span>
          </button>
        </div>
      </div>
      <div id="dkResult"></div>`;
    $('#btnLoadDk').onclick = () => this.guarded(() => this._load());
    if (!this._hasData) this.guarded(() => this._load());
  }
  async _load() {
    const profile = this.app.profile;
    if (!profile) return;
    const btn = $('#btnLoadDk');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
    const bulan = parseInt($('#dkBulan').value, 10);
    const minggu = $('#dkMinggu').value;
    this.selBulan = bulan;
    this.selMinggu = minggu;
    const f = {
      tahunAwal: String(todayY()),
      bulanAwal: fmtBulan(bulan),
      bulanAkhir: fmtBulan(bulan),
      kelas: profile.kelas
    };
    if (minggu !== 'Semua') f.minggu = minggu;
    const resultEl = $('#dkResult');
    resultEl.innerHTML = `<div class="skel-card"><div class="skel skel-line" style="width:50%"></div><div class="skel" style="height:200px;border-radius:10px;margin-top:.6rem"></div></div>`;
    try {
      let logs = LogsCache.read(f);
      if (!logs) {
        const res = await Api.logs(f);
        logs = res.logs || [];
        LogsCache.write(f, logs);
      }
      logs = Stats.dedup(logs);
      if (!logs.length) {
        this._hasData = false;
        resultEl.innerHTML = `<div class="empty"><span class="material-symbols-outlined">inbox</span><p>Belum ada data untuk filter ini.</p></div>`;
        return;
      }
      this._hasData = true;
      await this._render(logs, f);
    } catch (e) {
      if (e.message !== 'Unauthorized') resultEl.innerHTML = `<div class="empty"><span class="material-symbols-outlined">cloud_off</span><p>Gagal: ${esc(e.message)}</p></div>`;
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined">search</span>'; }
    }
  }
  async _render(rows, filter) {
    const perS = Stats.rekapPerSiswa(rows).sort((a, b) => b.rataKes - a.rataKes);
    const rataKelas = Stats.rataKelas(rows);
    const normKelas = Stats.normArr(rataKelas);
    const rataKes = Stats.keseluruhan(normKelas);
    const jumlahMinggu = new Set(rows.map(r => `${r.Tahun}|${r.Bulan}|${r.Minggu_Ke}`)).size;
    let best = 0, worst = 0;
    for (let i = 0; i < normKelas.length; i++) {
      if (normKelas[i] > normKelas[best]) best = i;
      if (normKelas[i] < normKelas[worst]) worst = i;
    }
    const kategoriRank = KATEGORI.map((k, i) => ({ label: k.label, val: rataKelas[k.key], max: k.max, norm: normKelas[i] }));
    const top3 = kategoriRank.slice().sort((a, b) => b.norm - a.norm).slice(0, 3);
    const bot3 = kategoriRank.slice().sort((a, b) => a.norm - b.norm).slice(0, 3);
    const periodeText = `${filter.bulanAwal} ${filter.tahunAwal}`;

    const resultEl = $('#dkResult');
    resultEl.innerHTML = `
      <div class="stats-grid">
        <div class="stat"><div class="num">${perS.length}</div><div class="lbl">Siswa</div></div>
        <div class="stat pos"><div class="num">${rataKes.toFixed(2)}</div><div class="lbl">Rata-rata</div></div>
        <div class="stat"><div class="num sm" style="color:var(--positive)">${esc(KATEGORI[best].label)}</div><div class="lbl">Terbaik</div></div>
        <div class="stat"><div class="num sm" style="color:var(--negative)">${esc(KATEGORI[worst].label)}</div><div class="lbl">Perlu Perhatian</div></div>
      </div>
      <div class="info-bar"><span class="material-symbols-outlined">info</span><span>${esc(periodeText)} · ${jumlahMinggu} minggu · ${perS.length} siswa</span></div>
      <details class="collapse">
        <summary><span class="material-symbols-outlined">bar_chart</span> Grafik Rata-rata (12 Kebiasaan)</summary>
        <div class="collapse-body"><div style="position:relative;height:380px"><canvas id="dkChart"></canvas></div></div>
      </details>
      <div class="card">
        <h3><span class="material-symbols-outlined">thumb_up</span> Top 3 Terbaik</h3>
        <table class="data" style="min-width:0;width:100%">
          <tbody>${top3.map(r => `<tr><td class="sticky-l" style="position:static;box-shadow:none;background:transparent">${esc(r.label)}</td><td style="font-weight:700;color:var(--positive)">${r.val.toFixed(2)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="card">
        <h3><span class="material-symbols-outlined">warning</span> Top 3 Perlu Perhatian</h3>
        <table class="data" style="min-width:0;width:100%">
          <tbody>${bot3.map(r => `<tr><td class="sticky-l" style="position:static;box-shadow:none;background:transparent">${esc(r.label)}</td><td style="font-weight:700;color:var(--negative)">${r.val.toFixed(2)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <details class="collapse">
        <summary><span class="material-symbols-outlined">table_rows</span> Detail per Siswa (${perS.length})</summary>
        <div class="collapse-body">
          <div class="table-wrap" style="max-height:60vh">
            <table class="data">
              <thead><tr><th class="sticky-l" style="min-width:150px">Nama</th>${KATEGORI.map(k => `<th>${esc(k.label)}</th>`).join('')}<th>Rata</th></tr></thead>
              <tbody>${perS.map(s => `<tr>
                <td class="sticky-l">${esc(s.nama)}</td>
                ${KATEGORI.map(k => {
                  const v = s.rata[k.key];
                  const r = v / k.max;
                  const cls = r >= THRESHOLD.BAIK ? 'skor-baik' : (r >= THRESHOLD.CUKUP ? 'skor-cukup' : 'skor-kurang');
                  const d = k.max === 4 ? v.toFixed(2) : v.toFixed(1);
                  return `<td class="${cls}">${d}</td>`;
                }).join('')}
                <td style="font-weight:700;color:var(--primary)">${s.rataKes.toFixed(2)}</td>
              </tr>`).join('')}</tbody>
            </table>
          </div>
        </div>
      </details>`;
    await ensureChart();
    this._charts.forEach(c => { try { c.destroy(); } catch {} });
    this._charts = [];
    const cv = $('#dkChart');
    if (cv && typeof Chart !== 'undefined') {
      this._charts.push(new Chart(cv, {
        type: 'bar',
        data: {
          labels: KATEGORI.map(k => k.label),
          datasets: [{ data: normKelas.map(v => Number(v.toFixed(2))), backgroundColor: normKelas.map(v => v >= 3.5 ? '#10B981' : (v >= 2.5 ? '#F59E0B' : '#F43F5E')), borderRadius: 6, maxBarThickness: 40 }]
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { beginAtZero: true, max: 4, ticks: { stepSize: 1, font: { size: 10 } }, grid: { color: '#e2e8f0' } },
            y: { grid: { display: false }, ticks: { font: { size: 11, weight: '600' }, color: '#1e293b', autoSkip: false } }
          }
        }
      }));
    }
  }
}

/* ========== DASH SEKOLAH TAB ========== */
class DashSekolahTab extends BaseTab {
  constructor(el, app) { super(el, app); this._charts = []; }
  render() {
    const defaultBulan = fmtBulan(todayM());
    this.el.innerHTML = `
      <h2 class="section-title"><span class="material-symbols-outlined">domain</span> Dashboard Sekolah</h2>
      <div class="card" style="padding:.85rem">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.5rem;align-items:end">
          <div class="form-group" style="margin:0">
            <label>Tahun</label>
            <select id="dsTahun" class="form-select">${[todayY()-1, todayY(), todayY()+1].map(y => `<option value="${y}"${y === todayY() ? ' selected' : ''}>${y}</option>`).join('')}</select>
          </div>
          <div class="form-group" style="margin:0">
            <label>Bln Awal</label>
            <select id="dsBulanAwal" class="form-select">${BULAN.map(b => `<option${b === defaultBulan ? ' selected' : ''}>${esc(b)}</option>`).join('')}</select>
          </div>
          <div class="form-group" style="margin:0">
            <label>Bln Akhir</label>
            <select id="dsBulanAkhir" class="form-select">${BULAN.map(b => `<option${b === defaultBulan ? ' selected' : ''}>${esc(b)}</option>`).join('')}</select>
          </div>
          <button id="btnLoadDs" class="btn btn-primary" style="min-width:52px;padding:.6rem"><span class="material-symbols-outlined">search</span></button>
        </div>
      </div>
      <div id="dsResult"></div>`;
    $('#btnLoadDs').onclick = () => this.guarded(() => this._load());
    this.guarded(() => this._load());
  }
  async _load() {
    const btn = $('#btnLoadDs');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
    const tahun = $('#dsTahun').value;
    const f = { tahunAwal: tahun, tahunAkhir: tahun, bulanAwal: $('#dsBulanAwal').value, bulanAkhir: $('#dsBulanAkhir').value };
    if (BULAN.indexOf(f.bulanAwal) > BULAN.indexOf(f.bulanAkhir)) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined">search</span>'; }
      return toast('Bulan akhir harus setelah bulan awal.', 'error');
    }
    const resultEl = $('#dsResult');
    resultEl.innerHTML = `<div class="skel-card"><div class="skel skel-line" style="width:50%"></div><div class="skel" style="height:200px;border-radius:10px;margin-top:.6rem"></div></div>`;
    try {
      let logs = LogsCache.read(f);
      if (!logs) {
        const res = await Api.logs(f);
        logs = res.logs || [];
        LogsCache.write(f, logs);
      }
      logs = Stats.dedup(logs);
      if (!logs.length) {
        resultEl.innerHTML = `<div class="empty"><span class="material-symbols-outlined">inbox</span><p>Belum ada data untuk filter ini.</p></div>`;
        return;
      }
      await this._render(logs, f);
    } catch (e) {
      if (e.message !== 'Unauthorized') resultEl.innerHTML = `<div class="empty"><span class="material-symbols-outlined">cloud_off</span><p>Gagal: ${esc(e.message)}</p></div>`;
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined">search</span>'; }
    }
  }
  async _render(rows, filter) {
    const rekap = KELAS.map(kelas => {
      const r = rows.filter(x => x.Kelas === kelas);
      if (!r.length) return { kelas, jumlah: 0, rata: null, norm: null, rataKes: null, minggu: 0 };
      const perS = Stats.rekapPerSiswa(r);
      const rata = Stats.rataKelas(r);
      const norm = Stats.normArr(rata);
      const minggu = new Set(r.map(x => `${x.Tahun}|${x.Bulan}|${x.Minggu_Ke}`)).size;
      return { kelas, jumlah: perS.length, rata, norm, rataKes: Stats.keseluruhan(norm), minggu };
    });
    const terisi = rekap.filter(r => r.rataKes !== null);
    const rataSek = terisi.length ? terisi.reduce((s, r) => s + r.rataKes, 0) / terisi.length : 0;
    const best = terisi.length ? terisi.reduce((a, b) => b.rataKes > a.rataKes ? b : a) : null;
    const worst = terisi.length ? terisi.reduce((a, b) => b.rataKes < a.rataKes ? b : a) : null;
    const totalSiswa = rekap.reduce((s, r) => s + (r.jumlah || 0), 0);
    const totalMinggu = new Set(rows.map(r => `${r.Tahun}|${r.Bulan}|${r.Minggu_Ke}`)).size;
    const periodeText = filter.bulanAwal === filter.bulanAkhir ? `${filter.bulanAwal} ${filter.tahunAwal}` : `${filter.bulanAwal} – ${filter.bulanAkhir} ${filter.tahunAwal}`;
    const resultEl = $('#dsResult');
    resultEl.innerHTML = `
      <div class="stats-grid">
        <div class="stat"><div class="num">${terisi.length}/6</div><div class="lbl">Kelas</div></div>
        <div class="stat pos"><div class="num">${rataSek.toFixed(2)}</div><div class="lbl">Rata-rata</div></div>
        <div class="stat"><div class="num sm" style="color:var(--positive)">${esc(best ? best.kelas : '-')}</div><div class="lbl">Terbaik</div></div>
        <div class="stat"><div class="num sm" style="color:var(--negative)">${esc(worst ? worst.kelas : '-')}</div><div class="lbl">Perhatian</div></div>
      </div>
      <div class="info-bar"><span class="material-symbols-outlined">info</span><span>${esc(periodeText)} · ${totalMinggu} minggu · ${totalSiswa} siswa</span></div>
      <details class="collapse"><summary><span class="material-symbols-outlined">bar_chart</span> Rata-rata Antar Kelas</summary>
        <div class="collapse-body"><div style="position:relative;height:300px"><canvas id="dsChart1"></canvas></div></div>
      </details>
      <details class="collapse"><summary><span class="material-symbols-outlined">insights</span> Per Kategori</summary>
        <div class="collapse-body"><div style="position:relative;height:380px"><canvas id="dsChart2"></canvas></div></div>
      </details>
      <details class="collapse"><summary><span class="material-symbols-outlined">table_rows</span> Rekap Kelas</summary>
        <div class="collapse-body">
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th class="sticky-l" style="min-width:80px">Kelas</th><th>Jml</th><th>Mgg</th>${KATEGORI.map(k => `<th>${esc(k.label)}</th>`).join('')}<th>Rata</th></tr></thead>
              <tbody>${rekap.map(r => {
                if (!r.jumlah) return `<tr><td class="sticky-l">${esc(r.kelas)}</td><td colspan="${KATEGORI.length + 3}" style="color:var(--muted);font-style:italic">Belum ada</td></tr>`;
                return `<tr><td class="sticky-l">${esc(r.kelas)}</td><td>${r.jumlah}</td><td>${r.minggu}</td>
                  ${KATEGORI.map(k => { const v = r.rata[k.key]; const ratio = v / k.max; const cls = ratio >= THRESHOLD.BAIK ? 'skor-baik' : (ratio >= THRESHOLD.CUKUP ? 'skor-cukup' : 'skor-kurang'); const d = k.max === 4 ? v.toFixed(2) : v.toFixed(1); return `<td class="${cls}">${d}</td>`; }).join('')}
                  <td style="font-weight:700;color:var(--positive)">${r.rataKes.toFixed(2)}</td></tr>`;
              }).join('')}</tbody>
            </table>
          </div>
        </div>
      </details>`;
    await ensureChart();
    this._charts.forEach(c => { try { c.destroy(); } catch {} });
    this._charts = [];
    const c1 = $('#dsChart1');
    if (c1 && typeof Chart !== 'undefined') {
      this._charts.push(new Chart(c1, {
        type: 'bar',
        data: { labels: rekap.map(r => r.kelas), datasets: [{ data: rekap.map(r => r.rataKes !== null ? Number(r.rataKes.toFixed(2)) : 0), backgroundColor: rekap.map(r => r.rataKes === null ? '#CBD5E1' : (r.rataKes >= 3.5 ? '#10B981' : (r.rataKes >= 2.5 ? '#F59E0B' : '#F43F5E'))), borderRadius: 6, maxBarThickness: 40 }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 4, ticks: { stepSize: 1, font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
      }));
    }
    const c2 = $('#dsChart2');
    if (c2 && typeof Chart !== 'undefined') {
      this._charts.push(new Chart(c2, {
        type: 'bar',
        data: { labels: rekap.map(r => r.kelas), datasets: KATEGORI.map((k, i) => ({ label: k.label, data: rekap.map(r => r.norm ? Number(r.norm[i].toFixed(2)) : 0), backgroundColor: CHART_COLORS[i] })) },
        options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 8, font: { size: 9 } } } }, scales: { y: { beginAtZero: true, max: 4, ticks: { stepSize: 1, font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
      }));
    }
  }
}

/* ========== CETAK TAB ========== */
class CetakTab extends BaseTab {
  constructor(el, app) {
    super(el, app);
    this.jenis = 'rapor';
    this.preset = 'bulan'; // bulan | sem1 | sem2 | tahun | custom
    this.customAwalBulan = todayM();
    this.customAwalTahun = todayY();
    this.customAkhirBulan = todayM();
    this.customAkhirTahun = todayY();
  }

  render() {
    const profile = this.app.profile;
    this.el.innerHTML = `
      <h2 class="section-title"><span class="material-symbols-outlined">print</span> Cetak & Preview</h2>
      <div class="card">
        <div class="seg-control">
          <button class="seg-btn${this.jenis === 'rapor' ? ' active' : ''}" data-jenis="rapor"><span class="material-symbols-outlined">person</span><span>Rapor</span></button>
          <button class="seg-btn${this.jenis === 'kelas' ? ' active' : ''}" data-jenis="kelas"><span class="material-symbols-outlined">groups</span><span>Kelas</span></button>
          <button class="seg-btn${this.jenis === 'sekolah' ? ' active' : ''}" data-jenis="sekolah"><span class="material-symbols-outlined">apartment</span><span>Sekolah</span></button>
        </div>

        ${profile ? `<div class="info-bar" id="infoKelas" style="margin-bottom:.6rem"><span class="material-symbols-outlined">school</span><span>${esc(profile.kelas)}</span></div>` :
        `<button class="btn btn-ghost" id="btnPickKelas" style="margin-bottom:.6rem"><span class="material-symbols-outlined">school</span> Pilih Kelas Dulu</button>`}

        <label class="card-label">Periode</label>
        <div class="preset-grid" id="presetGrid">
          <button class="preset-btn${this.preset === 'bulan' ? ' active' : ''}" data-preset="bulan"><span class="material-symbols-outlined">calendar_today</span>Bln Ini</button>
          <button class="preset-btn${this.preset === 'sem1' ? ' active' : ''}" data-preset="sem1">Sem 1</button>
          <button class="preset-btn${this.preset === 'sem2' ? ' active' : ''}" data-preset="sem2">Sem 2</button>
          <button class="preset-btn${this.preset === 'tahun' ? ' active' : ''}" data-preset="tahun">1 Tahun</button>
          <button class="preset-btn${this.preset === 'custom' ? ' active' : ''}" data-preset="custom"><span class="material-symbols-outlined">tune</span>Custom</button>
        </div>

        <div class="preset-info" id="presetInfo">
          <span class="material-symbols-outlined">event</span>
          <span id="presetInfoText"></span>
        </div>

        <div id="customPeriode"></div>

        <div id="grpRapor" style="margin-top:.2rem">
          <div class="form-group" style="margin-bottom:.5rem">
            <label>Siswa</label>
            <select id="cSiswa" class="form-select"><option value="">-- Pilih Siswa --</option></select>
          </div>
          <label style="display:flex;align-items:center;gap:.5rem;font-size:.82rem;cursor:pointer;padding:.5rem .1rem;font-weight:600;color:var(--text)">
            <input type="checkbox" id="cBatch" style="width:18px;height:18px;accent-color:var(--primary);flex-shrink:0">
            <span>Cetak semua siswa (batch, 1 PDF)</span>
          </label>
        </div>

        <button id="btnPreview" class="btn btn-primary" style="margin-top:.7rem">
          <span class="material-symbols-outlined">visibility</span> Tampilkan Preview
        </button>
      </div>
      <div class="empty" style="padding:1rem">
        <p style="font-size:.78rem;max-width:420px">Preview WYSIWYG — persis seperti hasil cetak. Setelah preview muncul, klik <b>Cetak / PDF</b>.</p>
      </div>`;

    this._bind();
  }

  _bind() {
    const pickBtn = $('#btnPickKelas');
    if (pickBtn) pickBtn.onclick = () => this.app.showProfileModal(true);

    $$('.seg-btn', this.el).forEach(btn => {
      btn.onclick = () => {
        this.jenis = btn.dataset.jenis;
        $$('.seg-btn', this.el).forEach(b => b.classList.toggle('active', b === btn));
        this._updJenis();
      };
    });

    $$('.preset-btn', this.el).forEach(btn => {
      btn.onclick = () => {
        this.preset = btn.dataset.preset;
        $$('.preset-btn', this.el).forEach(b => b.classList.toggle('active', b === btn));
        this._updPreset();
      };
    });

    $('#cSiswa').onchange = () => { if ($('#cSiswa').value) $('#cBatch').checked = false; };
    $('#cBatch').onchange = () => {
      const dis = $('#cBatch').checked;
      $('#cSiswa').disabled = dis;
      if (dis) $('#cSiswa').value = '';
    };

    $('#btnPreview').onclick = () => this.guarded(() => this._preview());

    this._updJenis();
    this._updPreset();
  }

  _updJenis() {
    const j = this.jenis;
    const infoKelas = $('#infoKelas');
    if (infoKelas) infoKelas.style.display = j === 'sekolah' ? 'none' : '';
    const pick = $('#btnPickKelas');
    if (pick) pick.style.display = j === 'sekolah' ? 'none' : '';
    const grpRapor = $('#grpRapor');
    if (grpRapor) grpRapor.style.display = j === 'rapor' ? '' : 'none';
    if (j === 'rapor') this._fillSiswa();
  }

  _getPeriode() {
    const today = new Date();
    const bNow = today.getMonth();
    const yNow = today.getFullYear();
    const ta = getTahunAjaran(bNow, yNow);

    if (this.preset === 'bulan') {
      return {
        bulanAwal: fmtBulan(bNow),
        bulanAkhir: fmtBulan(bNow),
        tahunAwal: yNow,
        tahunAkhir: yNow,
        label: `${fmtBulan(bNow)} ${yNow}`
      };
    }
    if (this.preset === 'sem1') {
      return {
        bulanAwal: 'Juli',
        bulanAkhir: 'Desember',
        tahunAwal: ta.start,
        tahunAkhir: ta.start,
        label: `Semester 1 · ${ta.label}`
      };
    }
    if (this.preset === 'sem2') {
      return {
        bulanAwal: 'Januari',
        bulanAkhir: 'Juni',
        tahunAwal: ta.end,
        tahunAkhir: ta.end,
        label: `Semester 2 · ${ta.label}`
      };
    }
    if (this.preset === 'tahun') {
      return {
        bulanAwal: 'Juli',
        bulanAkhir: 'Juni',
        tahunAwal: ta.start,
        tahunAkhir: ta.end,
        label: `Tahun Ajaran ${ta.label}`
      };
    }
    // custom
    return {
      bulanAwal: fmtBulan(this.customAwalBulan),
      bulanAkhir: fmtBulan(this.customAkhirBulan),
      tahunAwal: this.customAwalTahun,
      tahunAkhir: this.customAkhirTahun,
      label: `${fmtBulan(this.customAwalBulan)} ${this.customAwalTahun} – ${fmtBulan(this.customAkhirBulan)} ${this.customAkhirTahun}`
    };
  }

  _updPreset() {
    const info = $('#presetInfoText');
    const custom = $('#customPeriode');
    if (this.preset === 'custom') {
      if (info) info.textContent = 'Atur periode kustom:';
      if (custom) {
        custom.innerHTML = `
          <div class="custom-periode">
            <div style="font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em">Dari</div>
            <div class="row">
              <div>
                <label>Bulan</label>
                <select id="custAwalB" class="form-select">${BULAN.map((b, i) => `<option value="${i}"${i === this.customAwalBulan ? ' selected' : ''}>${esc(b)}</option>`).join('')}</select>
              </div>
              <div>
                <label>Tahun</label>
                <select id="custAwalT" class="form-select">${[todayY()-2,todayY()-1,todayY(),todayY()+1,todayY()+2].map(y => `<option value="${y}"${y === this.customAwalTahun ? ' selected' : ''}>${y}</option>`).join('')}</select>
              </div>
            </div>
            <div style="font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:.3rem">Sampai</div>
            <div class="row">
              <div>
                <label>Bulan</label>
                <select id="custAkhirB" class="form-select">${BULAN.map((b, i) => `<option value="${i}"${i === this.customAkhirBulan ? ' selected' : ''}>${esc(b)}</option>`).join('')}</select>
              </div>
              <div>
                <label>Tahun</label>
                <select id="custAkhirT" class="form-select">${[todayY()-2,todayY()-1,todayY(),todayY()+1,todayY()+2].map(y => `<option value="${y}"${y === this.customAkhirTahun ? ' selected' : ''}>${y}</option>`).join('')}</select>
              </div>
            </div>
          </div>`;
        const upd = () => {
          this.customAwalBulan = parseInt($('#custAwalB').value, 10);
          this.customAwalTahun = parseInt($('#custAwalT').value, 10);
          this.customAkhirBulan = parseInt($('#custAkhirB').value, 10);
          this.customAkhirTahun = parseInt($('#custAkhirT').value, 10);
          const p = this._getPeriode();
          if (info) info.textContent = p.label;
        };
        ['#custAwalB','#custAwalT','#custAkhirB','#custAkhirT'].forEach(sel => {
          const el = $(sel);
          if (el) el.onchange = upd;
        });
      }
    } else {
      const p = this._getPeriode();
      if (info) info.textContent = p.label;
      if (custom) custom.innerHTML = '';
    }
  }

  _fillSiswa() {
    const master = (this.app.boot && this.app.boot.master) || [];
    const profile = this.app.profile;
    if (!profile) return;
    const siswa = master.filter(s => s.Kelas === profile.kelas).sort((a, b) => String(a.Nama_Siswa).localeCompare(String(b.Nama_Siswa)));
    const sel = $('#cSiswa');
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = '<option value="">-- Pilih Siswa --</option>' + siswa.map(s => `<option value="${escAttr(s.NIS)}"${String(s.NIS) === String(cur) ? ' selected' : ''}>${esc(s.Nama_Siswa)}</option>`).join('');
  }

  async _preview() {
    const boot = this.app.boot;
    if (!boot || !boot.master || !boot.master.length) return toast('Data master belum siap.', 'error');
    const profile = this.app.profile;
    if (this.jenis !== 'sekolah' && !profile) return toast('Pilih kelas dulu.', 'error');

    const periode = this._getPeriode();
    const f = {
      tahunAwal: String(periode.tahunAwal),
      tahunAkhir: String(periode.tahunAkhir),
      bulanAwal: periode.bulanAwal,
      bulanAkhir: periode.bulanAkhir
    };
    // Validate range
    const idxA = BULAN.indexOf(periode.bulanAwal), idxB = BULAN.indexOf(periode.bulanAkhir);
    const urutA = periode.tahunAwal * 100 + idxA;
    const urutB = periode.tahunAkhir * 100 + idxB;
    if (urutA > urutB) return toast('Bulan awal harus sebelum bulan akhir.', 'error');

    const btn = $('#btnPreview');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span><span>Menyiapkan...</span>';

    try {
      const query = { ...f };
      if (this.jenis !== 'sekolah') query.kelas = profile.kelas;
      let logs = LogsCache.read(query);
      if (!logs) {
        const res = await Api.logs(query);
        logs = res.logs || [];
        LogsCache.write(query, logs);
      }
      logs = Stats.dedup(logs);
      if (!logs.length) {
        btn.disabled = false;
        btn.innerHTML = orig;
        return toast('Belum ada data untuk periode ini.', 'error');
      }

      const opts = {
        identitas: boot.identitas,
        waliKelas: boot.waliKelas,
        tahunAwal: periode.tahunAwal,
        tahunAkhir: periode.tahunAkhir,
        bulanAwal: periode.bulanAwal,
        bulanAkhir: periode.bulanAkhir,
        periodeLabel: periode.label
      };
      const chartTasks = [];
      const pages = [];

      if (this.jenis === 'rapor') {
        const isBatch = $('#cBatch').checked;
        const kelas = profile.kelas;
        const siswaKelas = boot.master.filter(s => s.Kelas === kelas).sort((a, b) => String(a.Nama_Siswa).localeCompare(String(b.Nama_Siswa)));
        if (isBatch) {
          if (siswaKelas.length > 50) { btn.disabled = false; btn.innerHTML = orig; return toast('Batch maksimal 50 siswa.', 'error'); }
          if (siswaKelas.length > 15) toast(`Menyiapkan ${siswaKelas.length} halaman...`, 'success');
          for (const siswa of siswaKelas) {
            const rows = logs.filter(r => String(r.NIS) === String(siswa.NIS));
            if (!rows.length) continue;
            pages.push(PrintEngine.buildRaporPage(siswa, rows, opts));
            const uid = 'r' + String(siswa.NIS).replace(/[^a-z0-9]/gi, '');
            chartTasks.push(() => PrintEngine.renderChartKategori('c-kat-' + uid, Stats.normArr(Stats.rataPerKategori(rows))));
            if (rows.length >= 2) chartTasks.push(() => PrintEngine.renderChartTren('c-tren-' + uid, PrintEngine.pointsTrendIndividu(rows)));
          }
          if (!pages.length) { btn.disabled = false; btn.innerHTML = orig; return toast('Tidak ada siswa dengan data.', 'error'); }
          opts.title = `Rapor ${kelas} (${pages.length})`;
        } else {
          const nis = $('#cSiswa').value;
          if (!nis) { btn.disabled = false; btn.innerHTML = orig; return toast('Pilih siswa dulu.', 'error'); }
          const siswa = boot.master.find(s => String(s.NIS) === String(nis));
          if (!siswa) { btn.disabled = false; btn.innerHTML = orig; return toast('Siswa tidak ditemukan.', 'error'); }
          const rows = logs.filter(r => String(r.NIS) === String(nis));
          if (!rows.length) { btn.disabled = false; btn.innerHTML = orig; return toast('Siswa belum punya data.', 'error'); }
          pages.push(PrintEngine.buildRaporPage(siswa, rows, opts));
          const uid = 'r' + String(siswa.NIS).replace(/[^a-z0-9]/gi, '');
          chartTasks.push(() => PrintEngine.renderChartKategori('c-kat-' + uid, Stats.normArr(Stats.rataPerKategori(rows))));
          if (rows.length >= 2) chartTasks.push(() => PrintEngine.renderChartTren('c-tren-' + uid, PrintEngine.pointsTrendIndividu(rows)));
          opts.title = 'Rapor ' + siswa.Nama_Siswa;
        }
      } else if (this.jenis === 'kelas') {
        const kelas = profile.kelas;
        pages.push(PrintEngine.buildKelasPage(kelas, logs, opts));
        chartTasks.push(() => PrintEngine.renderChartKategori('c-kls-kat', Stats.normArr(Stats.rataKelas(logs))));
        if (logs.length >= 4) {
          const pts = PrintEngine.pointsTrendMingguan(logs);
          if (pts.length >= 2) chartTasks.push(() => PrintEngine.renderChartTren('c-kls-tren', pts));
        }
        opts.title = 'Laporan ' + kelas;
      } else if (this.jenis === 'sekolah') {
        pages.push(PrintEngine.buildSekolahPage(logs, opts));
        const rekap = KELAS.map(k => {
          const r = logs.filter(x => x.Kelas === k);
          if (!r.length) return null;
          const rata = Stats.rataKelas(r);
          return { label: k.replace('Kelas ', 'Kls '), value: Stats.keseluruhan(Stats.normArr(rata)) };
        }).filter(Boolean);
        if (rekap.length >= 2) chartTasks.push(() => PrintEngine.renderChartPerbandingan('c-sek-perbandingan', rekap));
        if (logs.length >= 4) {
          const pts = PrintEngine.pointsTrendMingguan(logs);
          if (pts.length >= 2) chartTasks.push(() => PrintEngine.renderChartTren('c-sek-tren', pts));
        }
        opts.title = 'Laporan Sekolah';
      }
      await PrintEngine.render(pages, { ...opts, chartTasks });
    } catch (e) {
      if (e.message !== 'Unauthorized') toast(e.message || 'Gagal membuat preview.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  }
}

/* ========== BOOT ========== */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => new App().init(), { once: true });
} else {
  new App().init();
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  });
}

})();
</script>
